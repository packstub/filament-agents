name: GitHub release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create release from CHANGELOG.md
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract the changelog section for this tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { printing = ($0 ~ "^## " v "([^0-9]|$)") ; next }
            printing { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No \"## $version\" section in CHANGELOG.md; see the changelog for details." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; skipping."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
